<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jon's Ultra v0.5</title>
<style>
  html, body { margin: 0; height: 100%; background: #10201a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Jon's Ultra"></canvas>
<script>
'use strict';

// ============================================================================
// Jon's Ultra — v0.5 — Architecture §9 step 5
// Rainforest kit, sun/moon clocks, stars, ambient life, rain and mist, foot dust, synthesised audio bed.
// Synthetic HURT-shaped 20-mile test profile until the real one lands at step 6.
// Allowed globals: GAME, RACES, BIOMES.
// ============================================================================

// ===== MODULE: engine =====
const ENGINE = {
  W: 1280, H: 720,
  STEP: 1 / 60,
  MAX_FRAME: 0.25,
  COYOTE_MS: 80,
  BUFFER_MS: 100,
  TEST_SCROLL_SPEED: 300    // px/s flat test ground; sim owns this from step 2
};

const GAME = {
  t: 0,
  paused: false,
  scroll: 0,
  speed: ENGINE.TEST_SCROLL_SPEED,
  camY: 0,                  // vertical camera offset: looks down the hill on descents
  fast: false,              // F: 4× scroll for testing
  course: null, mile: 0, lap: 1, elev: 0, grade: 0, surface: 'clay', jumpMul: 1, animSpeed: 0,
  diff: 'realistic',
  raceSec: 0, hour: 6, night: 0,
  energy: 100, hydration: 100, bonk: false, cramp: false, crampTimer: 4,
  collected: new Set(), floaters: [], toasts: [],
  shake: 0,
  screen: 'intro',          // intro | race | dnf | finish
  stations: [], nextIdx: 0, aid: null, dnf: null, finish: null, pacer: null, bonusItem: null, forceCutoffMiss: false,
  stats: { hits: 0, bonks: 0, nightMiles: 0 },
  rain: 0, mistAmount: 0, life: [], shooting: null,
  jon: null,
  particles: [],
  fps: { frames: 0, since: 0, value: 0 },
  debug: true,
  alpha: 0,                 // render interpolation fraction between physics steps
  viewer: { on: false, idx: 0, timer: 0, jon: null }
};
const RACES = {};
const BIOMES = {};

function rng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function hash(n) {
  n = (n ^ 61) ^ (n >>> 16);
  n = (n + (n << 3)) | 0;
  n ^= n >>> 4;
  n = (n * 0x27d4eb2d) | 0;
  n ^= n >>> 15;
  return (n >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const lerpTo = (cur, target, dt, rate) => cur + (target - cur) * (1 - Math.exp(-dt * rate));
// Segment from a point: angle from straight down, positive = forward (+x). Negative length = up.
const seg = (p, len, ang) => ({ x: p.x + Math.sin(ang) * len, y: p.y + Math.cos(ang) * len });

const Input = {
  jumpHeld: false, duckHeld: false, jumpPressedAt: -1,
  pauseRequested: false, viewerRequested: false, scaleDelta: 0, skipMiles: 0, uiKey: null,
  touchJumpId: null, touchDuckId: null,

  init(canvas) {
    const jumpKeys = new Set(['Space', 'ArrowUp', 'KeyW']);
    const duckKeys = new Set(['ArrowDown', 'KeyS']);
    const pauseKeys = new Set(['Escape', 'KeyP']);
    window.addEventListener('keydown', e => {
      AudioBed.init();
      if (jumpKeys.has(e.code)) {
        if (!this.jumpHeld) this.jumpPressedAt = performance.now();
        this.jumpHeld = true; e.preventDefault();
      } else if (duckKeys.has(e.code)) { this.duckHeld = true; e.preventDefault(); }
      else if (pauseKeys.has(e.code)) { if (!e.repeat) { if (GAME.screen === 'race') this.pauseRequested = true; else this.uiKey = 'select'; } e.preventDefault(); }
      else if (e.code === 'Enter' && !e.repeat) this.uiKey = 'primary';
      else if (e.code === 'KeyG' && !e.repeat) this.uiKey = 'gotoFinish';
      else if (e.code === 'KeyK' && !e.repeat) { GAME.forceCutoffMiss = true; toast('Next station: forced cutoff miss'); }
      else if (e.code === 'KeyJ' && !e.repeat) this.viewerRequested = true;
      else if (e.code === 'KeyD' && !e.repeat) GAME.debug = !GAME.debug;
      else if (e.code === 'BracketLeft') this.scaleDelta -= 10;
      else if (e.code === 'BracketRight') this.scaleDelta += 10;
      else if (e.code === 'KeyF' && !e.repeat) GAME.fast = !GAME.fast;
      else if (e.code === 'Comma') this.skipMiles -= 1;
      else if (e.code === 'Period') this.skipMiles += 1;
      else if (e.code === 'KeyT' && !e.repeat) GAME.diff = GAME.diff === 'realistic' ? 'arcade' : 'realistic';
      else if (e.code === 'KeyN') GAME.raceSec += e.shiftKey ? 6 * 3600 : 3600;
      else if (e.code === 'KeyM' && !e.repeat) { if (e.shiftKey) GAME.course.moon = GAME.course.moon === 'full' ? 'none' : 'full'; else AudioBed.setMuted(!AudioBed.muted); }
      else if (e.code === 'KeyX' && !e.repeat) { if (GAME.night > 0.6 && !GAME.shooting) GAME.shooting = { x: 300 + atmoRng() * 600, y: 50 + atmoRng() * 150, vx: -650, vy: 220, age: 0 }; else toast('Shooting stars need full night'); }
      else if (e.code === 'KeyE' && !e.repeat) GAME.energy = 0;
      else if (e.code === 'KeyH' && !e.repeat) GAME.hydration = 0;
      else if (e.code === 'KeyR' && !e.repeat) { GAME.energy = 100; GAME.hydration = 100; }
    });
    window.addEventListener('keyup', e => {
      if (jumpKeys.has(e.code)) this.jumpHeld = false;
      else if (duckKeys.has(e.code)) this.duckHeld = false;
    });
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); AudioBed.init();
      if (GAME.paused) { this.pauseRequested = true; return; }
      {
        const rect = canvas.getBoundingClientRect();
        const lx = (e.clientX - rect.left) / Screen.scale, ly = (e.clientY - rect.top) / Screen.scale;
        if (UI.buttons.length && uiClick(lx, ly)) return;
        if (GAME.screen !== 'race') return;
      }
      const rect = canvas.getBoundingClientRect();
      const upper = (e.clientY - rect.top) < rect.height / 2;
      if (upper) {
        if (this.touchJumpId === null) { this.jumpPressedAt = performance.now(); this.jumpHeld = true; }
        this.touchJumpId = e.pointerId;
      } else { this.duckHeld = true; this.touchDuckId = e.pointerId; }
    });
    const release = e => {
      if (e.pointerId === this.touchJumpId) { this.touchJumpId = null; this.jumpHeld = false; }
      if (e.pointerId === this.touchDuckId) { this.touchDuckId = null; this.duckHeld = false; }
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', release);
    window.addEventListener('blur', () => { if (!GAME.paused && !GAME.viewer.on) GAME.paused = true; });
  },
  jumpBuffered(now) { return this.jumpPressedAt >= 0 && (now - this.jumpPressedAt) <= ENGINE.BUFFER_MS; },
  consumeJump() { this.jumpPressedAt = -1; }
};

const Screen = {
  canvas: null, ctx: null, scale: 1, dpr: 1,
  init(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.resize(); window.addEventListener('resize', () => this.resize());
  },
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.scale = Math.min(window.innerWidth / ENGINE.W, window.innerHeight / ENGINE.H);
    const cssW = Math.floor(ENGINE.W * this.scale), cssH = Math.floor(ENGINE.H * this.scale);
    this.canvas.style.width = cssW + 'px'; this.canvas.style.height = cssH + 'px';
    this.canvas.width = Math.floor(cssW * this.dpr); this.canvas.height = Math.floor(cssH * this.dpr);
  },
  begin() {
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.setTransform(this.scale * this.dpr, 0, 0, this.scale * this.dpr, 0, 0);
    return ctx;
  }
};

// Test-key teleport: move Jon and skip any stations passed without stopping at them.
function skipTo(mile) {
  GAME.scroll = Math.max(0, mile) * SIM.PX_PER_MILE; GAME.mile = GAME.scroll / SIM.PX_PER_MILE;
  while (GAME.nextIdx < GAME.stations.length && GAME.stations[GAME.nextIdx].absMile <= GAME.mile) GAME.nextIdx++;
}
function step(dt) {
  if (GAME.viewer.on) { viewerStep(dt); return; }
  if (GAME.screen === 'intro') return;
  GAME.t += dt;
  if (GAME.screen === 'race') { simStep(dt); aidStep(dt); }
  else { GAME.speed = lerpTo(GAME.speed, 0, dt, 6); GAME.animSpeed = 0; if (GAME.finish) GAME.finish.t += dt; GAME.shake = Math.max(0, GAME.shake - 18 * dt); }
  for (let k = GAME.toasts.length - 1; k >= 0; k--) { GAME.toasts[k].age += dt; if (GAME.toasts[k].age > 1.8) GAME.toasts.splice(k, 1); }
  jonStep(GAME.jon, dt);
  particlesStep(dt);
  atmoStep(dt, performance.now() / 1000);
  AudioBed.update(dt);
}

let lastFrame = 0, accum = 0;
function frame(now) {
  const dt = Math.min((now - lastFrame) / 1000, ENGINE.MAX_FRAME);
  lastFrame = now;

  if (Input.pauseRequested) { Input.pauseRequested = false; GAME.paused = !GAME.paused; accum = 0; }
  if (Input.viewerRequested) { Input.viewerRequested = false; viewerToggle(); accum = 0; }
  if (Input.scaleDelta) {
    JON.TARGET_PX = clamp(JON.TARGET_PX + Input.scaleDelta, 80, 180);
    Input.scaleDelta = 0;
  }
  if (Input.skipMiles) { skipTo(GAME.mile + Input.skipMiles); Input.skipMiles = 0; }
  if (Input.uiKey) {
    const k = Input.uiKey; Input.uiKey = null;
    if (k === 'gotoFinish') { if (GAME.screen === 'race') skipTo(finishAbsMile() - 0.3); }
    else if (k === 'primary') { if (GAME.screen === 'intro') uiAction('go'); else if (GAME.screen === 'dnf' || GAME.screen === 'finish') uiAction('restart'); }
    else if (k === 'select') { if (GAME.screen === 'dnf' || GAME.screen === 'finish') uiAction('select'); }
  }
  if (GAME.screen === 'intro' && Input.jumpBuffered(now)) { Input.consumeJump(); uiAction('go'); }

  if (!GAME.paused) {
    accum += dt;
    while (accum >= ENGINE.STEP) { step(ENGINE.STEP); accum -= ENGINE.STEP; }
  }
  GAME.alpha = accum / ENGINE.STEP;

  GAME.fps.frames++;
  if (now - GAME.fps.since >= 500) {
    GAME.fps.value = Math.round(GAME.fps.frames * 1000 / (now - GAME.fps.since));
    GAME.fps.frames = 0; GAME.fps.since = now;
  }

  render(Screen.begin(), now / 1000);
  requestAnimationFrame(frame);
}

// ===== MODULE: render =====
const RENDER = { GROUND_Y: 432 };   // ground line at ~60% of frame height

function render(ctx, tReal) {
  if (GAME.viewer.on) { viewerRender(ctx, tReal); return; }
  const kit = BIOMES[GAME.course.biome], pal = paletteAt(kit, GAME.hour);
  const groundY = RENDER.GROUND_Y + GAME.camY;
  const view = {
    scroll: GAME.scroll, W: ENGINE.W, H: ENGINE.H, groundY,
    // Ground line relative to Jon: the world tilts, Jon's feet stay put.
    groundAt: sx => groundY - (courseElev(GAME.course, GAME.mile + (sx - JON.X) / SIM.PX_PER_MILE) - GAME.elev) * SIM.FT_TO_PX,
    surfaceAt: sx => courseSurface(GAME.course, GAME.mile + (sx - JON.X) / SIM.PX_PER_MILE),
    // Parallax layers sink as Jon climbs, so height gained reads against the ridges.
    ridgeShift: (GAME.elev - GAME.course.altitudeFeet.min) / (GAME.course.altitudeFeet.max - GAME.course.altitudeFeet.min) * 70
  };
  const t = GAME.t;
  view.hour = GAME.hour; view.moon = GAME.course.moon; view.sun = { rise: parseHM(GAME.course.sun.rise), set: parseHM(GAME.course.sun.set) };
  view.mistAmount = GAME.mistAmount;

  ctx.save();
  if (GAME.shake > 0) ctx.translate((shakeRng() - 0.5) * 2 * GAME.shake, (shakeRng() - 0.5) * 2 * GAME.shake);
  const zk = finishZoom();
  if (zk > 0) {                                                       // camera eases toward Katie and Emma
    const ke = katieEmmaScreen(view), fx = (ke.katie.x + ke.emma.x) / 2, fy = ke.katie.y - 70;
    const z = 1 + RACE.FINISH_ZOOM * zk;
    ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy);
  }
  kit.sky(ctx, pal, t, view);
  kit.farRidge(ctx, pal, t, view);
  drawLife(ctx, t, 'sky', view);
  kit.midRidge(ctx, pal, t, view);
  drawLife(ctx, t, 'mid', view);
  kit.nearVegetation(ctx, pal, t, view);
  kit.ground(ctx, pal, t, view);
  drawAidStations(ctx, view);
  drawFinishLine(ctx, view, t, 'back');
  drawGroundShadow(ctx, JON.X, groundY, GAME.jon.y, -GAME.grade * SIM.FT_TO_PX, JON.TARGET_PX / JON.FIGURE_UNITS);
  drawPickups(ctx, view);
  drawPacer(ctx, view, t);
  particlesDraw(ctx);

  // Interpolate Jon's height between physics steps so 100–144 Hz screens don't judder.
  const j = GAME.jon;
  const yDraw = j.grounded ? 0 : lerp(j.prevY, j.y, GAME.alpha);
  const glassesOnCap = GAME.hour >= 17.75 || GAME.hour < 6.25;
  drawJon(ctx, JON_PAL, t, j, JON.X, groundY - yDraw, JON.TARGET_PX / JON.FIGURE_UNITS, yDraw, { glassesOnCap, lamp: GAME.night });

  drawFinishLine(ctx, view, t, 'front');
  kit.foreground(ctx, pal, t, view);
  drawRain(ctx, pal, view);
  if (GAME.night > 0) drawNight(ctx, GAME.night, j.headScreen);
  drawLife(ctx, t, 'near', view);                                   // fireflies and moths are light sources: over the darkness
  drawLife(ctx, t, 'fore', view);
  drawMeterEffects(ctx, t);
  ctx.restore();
  drawHUD(ctx);
  UI.buttons = [];
  if (GAME.screen === 'intro') drawIntroCard(ctx);
  else if (GAME.aid) drawAidCard(ctx);
  else if (GAME.screen === 'dnf') drawDNFCard(ctx);
  else if (GAME.screen === 'finish' && GAME.finish.t > RACE.FINISH_HOLD_S) drawFinishCard(ctx);
  drawToasts(ctx);
  if (GAME.paused) drawPause(ctx);
}

const shakeRng = rng(0x5a4e0);
// --- night: darkness overlay with the headlamp cone cut out. Drawn after the world, before the HUD. ---
let nightCanvas = null;
function getNightCanvas() {
  if (!nightCanvas) {
    nightCanvas = document.createElement('canvas');
    nightCanvas.width = ENGINE.W; nightCanvas.height = ENGINE.H;
  }
  return nightCanvas;
}
const LAMP = { LEN: 560, HALF: 0.34, PITCH: 0.14, HALO: 95 };
function drawNight(ctx, amount, headScreen) {
  const D = DIFFICULTY[GAME.diff];
  const ambient = clamp(D.nightAmbient + (GAME.course.moon === 'full' ? 0.3 : 0), 0, 0.9);
  const alpha = amount * (1 - ambient);
  if (alpha <= 0.01) return;
  const off = getNightCanvas(), o = off.getContext('2d');
  o.globalCompositeOperation = 'source-over';
  o.clearRect(0, 0, ENGINE.W, ENGINE.H);
  o.fillStyle = `rgba(4, 8, 14, ${alpha})`; o.fillRect(0, 0, ENGINE.W, ENGINE.H);
  const { x: hx, y: hy } = headScreen;
  o.globalCompositeOperation = 'destination-out';
  // Three nested wedges feather the cone edge; the radial gradient fades it with distance.
  const lampLen = LAMP.LEN * (bonusActive('battery') ? RACE.BATTERY_LAMP_MUL : 1);
  const g = o.createRadialGradient(hx, hy, 12, hx, hy, lampLen);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  o.fillStyle = g;
  for (const [half, a] of [[LAMP.HALF, 0.5], [LAMP.HALF * 0.78, 0.6], [LAMP.HALF * 0.55, 0.8]]) {
    o.globalAlpha = a;
    o.beginPath(); o.moveTo(hx, hy); o.arc(hx, hy, lampLen, LAMP.PITCH - half, LAMP.PITCH + half); o.closePath(); o.fill();
  }
  o.globalAlpha = 1;
  const halo = o.createRadialGradient(hx, hy, 0, hx, hy, LAMP.HALO);
  halo.addColorStop(0, 'rgba(0,0,0,0.75)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  o.fillStyle = halo; o.beginPath(); o.arc(hx, hy, LAMP.HALO, 0, Math.PI * 2); o.fill();
  ctx.drawImage(off, 0, 0, ENGINE.W, ENGINE.H);
  // Warm beam wash inside the cone.
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.10 * amount;
  const wg = ctx.createRadialGradient(hx, hy, 10, hx, hy, LAMP.LEN * 0.8);
  wg.addColorStop(0, '#ffd890'); wg.addColorStop(1, 'rgba(255,216,144,0)');
  ctx.fillStyle = wg; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.arc(hx, hy, LAMP.LEN * 0.8, LAMP.PITCH - LAMP.HALF, LAMP.PITCH + LAMP.HALF); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// Bonk: desaturate; empty meters: heartbeat vignette (Design Bible §8).
function drawMeterEffects(ctx, t) {
  if (GAME.bonk) {
    ctx.save();
    try { ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'rgba(128,128,128,0.75)'; ctx.fillRect(0, 0, ENGINE.W, ENGINE.H); }
    catch (e) { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'rgba(120,120,120,0.25)'; ctx.fillRect(0, 0, ENGINE.W, ENGINE.H); }
    ctx.restore();
  }
  if (GAME.bonk || GAME.cramp) {
    const beat = 0.5 + 0.5 * Math.pow(Math.max(0, Math.sin(t * 7.5)), 4);
    const vg = ctx.createRadialGradient(ENGINE.W / 2, ENGINE.H / 2, ENGINE.H * 0.35, ENGINE.W / 2, ENGINE.H / 2, ENGINE.H * 0.85);
    vg.addColorStop(0, 'rgba(60,0,0,0)'); vg.addColorStop(1, `rgba(60,0,0,${0.35 * beat})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, ENGINE.W, ENGINE.H);
  }
}
function drawPickups(ctx, view) {
  const i0 = Math.floor((GAME.mile - 0.1) / SIM.PICKUP_SPACING), i1 = Math.floor((GAME.mile + 0.3) / SIM.PICKUP_SPACING) + 1;
  for (let i = i0; i <= i1; i++) {
    const p = pickupAt(i);
    if (!p || GAME.collected.has(i)) continue;
    const x = JON.X + (p.mile - GAME.mile) * SIM.PX_PER_MILE;
    if (x < -30 || x > view.W + 30) continue;
    const y = view.groundAt(x) - 12 + Math.sin(GAME.t * 3 + i) * 2;
    ctx.save(); ctx.translate(x, y);
    if (p.type === 'gel') {
      ctx.fillStyle = '#E36A2B'; ctx.beginPath(); ctx.roundRect(-7, -9, 14, 18, 3); ctx.fill();
      ctx.fillStyle = '#F5D021'; ctx.fillRect(-4, -9, 8, 4);
    } else if (p.type === 'flask') {
      ctx.fillStyle = '#A9C7D6'; ctx.beginPath(); ctx.roundRect(-6, -10, 12, 20, 4); ctx.fill();
      ctx.fillStyle = '#2E7BD6'; ctx.fillRect(-3.5, -13, 7, 4);
    } else {
      ctx.fillStyle = '#E0338F'; ctx.beginPath(); ctx.moveTo(-11, -7); ctx.lineTo(11, -7); ctx.lineTo(0, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1F8A4C'; ctx.fillRect(-11, -9, 22, 3);
    }
    ctx.restore();
  }
  ctx.font = '600 14px ' + UI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of GAME.floaters) { ctx.fillStyle = `rgba(234,243,228,${1 - f.age / 1.2})`; ctx.fillText('+ ' + f.text, f.x, f.y); }
}

// --- race furniture in the world: aid stations, finish banner, crowd, pacer ---
function absMileToScreenX(absMile) { return JON.X + (absMile - GAME.mile) * SIM.PX_PER_MILE; }

function drawAidStations(ctx, view) {
  for (let i = Math.max(0, GAME.nextIdx - 1); i < Math.min(GAME.stations.length, GAME.nextIdx + 2); i++) {
    const occ = GAME.stations[i]; if (occ.isFinish) continue;
    const x = absMileToScreenX(occ.absMile);
    if (x < -160 || x > view.W + 160) continue;
    const y = view.groundAt(x);
    // tent behind the trail
    ctx.fillStyle = '#c94a3a';
    ctx.beginPath(); ctx.moveTo(x - 70, y - 4); ctx.lineTo(x - 10, y - 92); ctx.lineTo(x + 50, y - 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.moveTo(x - 10, y - 92); ctx.lineTo(x + 50, y - 4); ctx.lineTo(x + 18, y - 4); ctx.closePath(); ctx.fill();
    // table with cups
    ctx.fillStyle = '#8a6a3a'; ctx.fillRect(x + 56, y - 30, 60, 5); ctx.fillRect(x + 60, y - 25, 4, 22); ctx.fillRect(x + 108, y - 25, 4, 22);
    for (let k = 0; k < 5; k++) { ctx.fillStyle = k % 2 ? '#F5D021' : '#7FD1FF'; ctx.fillRect(x + 60 + k * 10, y - 38, 6, 8); }
    // sign
    ctx.fillStyle = '#F2F0E6'; ctx.fillRect(x - 60, y - 128, 120, 26);
    ctx.fillStyle = '#1A1A1A'; ctx.font = '600 13px ' + UI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(occ.station.name.split(' (')[0], x, y - 115);
    ctx.fillStyle = '#6a5a3a'; ctx.fillRect(x - 2, y - 102, 4, 98);
  }
}

// Spectator: simple standing figure, arms up on its own rhythm. Katie/Emma variants add glasses+fringe and a sign.
const CROWD_TOPS = ['#c84a4a', '#3d7cc9', '#e0a33a', '#5aa36a', '#8b5cb8', '#e07a9a', '#2c9c9c', '#d96b3b'];
function drawSpectator(ctx, x, y, s, seed, t, who) {
  const h1 = hash(seed * 31 + 7), h2 = hash(seed * 53 + 11), h3 = hash(seed * 71 + 3);
  const skin = ['#C58E62', '#8d5a3b', '#e9b98f', '#6b4128'][Math.floor(h2 * 4)], top = CROWD_TOPS[Math.floor(h1 * CROWD_TOPS.length)];
  const wave = Math.sin(t * 3.2 + h3 * Math.PI * 2);                  // staggered rhythm per person

// Finish line: banner over the trail, tape until it's broken, crowd on both sides, Katie and Emma front row near side.
function finishAbsMile() { return GAME.stations[GAME.stations.length - 1].absMile; }
function drawFinishLine(ctx, view, t, layer) {
  const fx = absMileToScreenX(finishAbsMile());
  if (fx < -300 || fx > view.W + 400) return;
  const gy = view.groundAt(fx);
  if (layer === 'back') {
    // far-side crowd (behind the trail)
    for (let i = 0; i < RACE.CROWD_N; i++) {
      if (hash(i * 19 + 1) > 0.5) continue;
      const dx = -RACE.CROWD_PX + hash(i * 23 + 5) * (RACE.CROWD_PX + 60);
      const x = fx + dx; drawSpectator(ctx, x, view.groundAt(x) - 10, 0.9, i, t, null);
    }
    // posts + banner
    ctx.fillStyle = '#6a5a3a'; ctx.fillRect(fx - 3, gy - 190, 6, 190); ctx.fillRect(fx + 84 - 3, gy - 190, 6, 190);
    ctx.fillStyle = '#c84a4a'; ctx.fillRect(fx - 10, gy - 190, 104, 34);
    ctx.fillStyle = '#F2F0E6'; ctx.font = '700 20px ' + UI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FINISH', fx + 42, gy - 173);
    // tape at hip height until Jon crosses it
    const broken = GAME.screen === 'finish';
    ctx.strokeStyle = '#F5D021'; ctx.lineWidth = 4;
    if (!broken) { ctx.beginPath(); ctx.moveTo(fx, gy - 70); ctx.lineTo(fx + 84, gy - 70); ctx.stroke(); }
    else {
      const fl = Math.sin(t * 5) * 6;
      ctx.beginPath(); ctx.moveTo(fx, gy - 70); ctx.quadraticCurveTo(fx + 10, gy - 40 + fl, fx + 4, gy - 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx + 84, gy - 70); ctx.quadraticCurveTo(fx + 74, gy - 40 - fl, fx + 80, gy - 10); ctx.stroke();
    }
  } else {
    // near-side crowd (in front of the trail), Katie and Emma front row, tortoise at the post
    for (let i = 0; i < RACE.CROWD_N; i++) {
      if (hash(i * 19 + 1) <= 0.5) continue;
      const dx = -RACE.CROWD_PX + hash(i * 23 + 5) * (RACE.CROWD_PX + 60);
      if (dx > -110 && dx < -20) continue;                                 // leave the front-row spot for Katie and Emma
      const x = fx + dx; drawSpectator(ctx, x, view.groundAt(x) + 14, 1.05, i + 100, t, null);
    }
    const ke = katieEmmaScreen(view);
    drawSpectator(ctx, ke.katie.x, ke.katie.y, 1.08, 501, t, 'katie');

}
function katieEmmaScreen(view) {
  const fx = absMileToScreenX(finishAbsMile());

// Camera ease toward Katie and Emma over the last ZOOM_LEAD_S seconds, held through the finish.
function finishZoom() {

  const distPx = (finishAbsMile() - GAME.mile) * SIM.PX_PER_MILE;
  if (distPx > 1600) return 0;
  const tTo = distPx / Math.max(GAME.speed, 40);

// Pacer: a plainer runner behind Jon for one segment. Points at pickups ahead.
function drawPacer(ctx, view, t) {
  const p = GAME.pacer; if (!p) return;
  const scale = JON.TARGET_PX / JON.FIGURE_UNITS * 0.92;
  const x = JON.X + RACE.PACER_X_OFFSET, gy = view.groundAt(x);
  const ph = p.phase, bob = -Math.abs(Math.sin(ph)) * 3;
  ctx.save(); ctx.translate(x, gy + bob * scale); ctx.scale(scale, scale);
  const leg = (q, col) => {
    const hip = 0.6 * Math.sin(q), rec = Math.max(0, Math.cos(q)), knee = 0.2 + 1.3 * rec * rec;
    const k = seg({ x: 0, y: -62 }, 30, hip), a = seg(k, 30, hip - knee);
    drawLimb(ctx, { x: 0, y: -62 }, k, 9, col); drawLimb(ctx, k, a, 8, col);
    ctx.fillStyle = '#1A1A1A'; ctx.beginPath(); ctx.roundRect(a.x - 6, a.y - 1, 16, 6, 3); ctx.fill();
  };

  ctx.fillStyle = '#2c9c9c'; ctx.beginPath(); ctx.roundRect(-9, -104, 18, 44, 5); ctx.fill();                 // teal top
  ctx.fillStyle = '#1f2a44'; ctx.beginPath(); ctx.roundRect(-10, -66, 20, 16, 3); ctx.fill();                 // navy shorts
  leg(ph, '#c48a62');
  const sh = { x: 1, y: -100 };
  for (const [q, col] of [[ph + Math.PI, '#a8744f'], [ph, '#c48a62']]) {
    const e = seg(sh, 20, -0.7 * Math.sin(q)), h = seg(e, 18, -0.7 * Math.sin(q) + 1.7);
    drawLimb(ctx, sh, e, 7, col); drawLimb(ctx, e, h, 6, col);
  }
  ctx.fillStyle = '#c48a62'; ctx.beginPath(); ctx.arc(2, -116, 11, 0, Math.PI * 2); ctx.fill();               // head
  ctx.fillStyle = '#c84a4a'; ctx.beginPath(); ctx.arc(2, -119, 12.5, Math.PI, Math.PI * 2); ctx.fill();       // red cap
  ctx.fillRect(2, -120, 22, 4);

  ctx.restore();
  // callouts: arrow over the next pickup within reach
  const i0 = Math.floor(GAME.mile / SIM.PICKUP_SPACING), i1 = Math.floor((GAME.mile + RACE.PACER_CALLOUT_PX / SIM.PX_PER_MILE) / SIM.PICKUP_SPACING) + 1;
  for (let i = i0; i <= i1; i++) {
    const pk = pickupAt(i); if (!pk || GAME.collected.has(i) || pk.mile <= GAME.mile) continue;
    const px = absMileToScreenX(pk.mile), py = view.groundAt(px) - 34 + Math.sin(t * 6) * 4;
    ctx.fillStyle = '#F5D021'; ctx.beginPath(); ctx.moveTo(px, py + 8); ctx.lineTo(px - 7, py - 4); ctx.lineTo(px + 7, py - 4); ctx.closePath(); ctx.fill();
    break;

// Soft contact shadow: follows the slope, shrinks and fades when airborne.
function drawGroundShadow(ctx, x, groundY, heightPx, slope, scale) {
  const k = 1 / (1 + heightPx / 90);
  ctx.save();
  ctx.translate(x + 4 * scale, groundY + 3); ctx.rotate(Math.atan(slope));
  ctx.fillStyle = `rgba(20,14,6,${0.10 * k})`;
  ctx.beginPath(); ctx.ellipse(0, 0, 34 * scale * (0.7 + 0.3 * k), 7 * scale * k, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(20,14,6,${0.20 * k})`;
  ctx.beginPath(); ctx.ellipse(0, 0, 24 * scale * (0.7 + 0.3 * k), 4.5 * scale * k, 0, 0, Math.PI * 2); ctx.fill();

const particleRng = rng(0xd0d0);
function spawnDust(x, y, n, color, sizeMul) {
  for (let i = 0; i < n; i++) {
    const a = particleRng();
    GAME.particles.push({
      x: x + (particleRng() - 0.5) * 18, y: y - particleRng() * 4,
      vx: -60 - a * 120, vy: -20 - particleRng() * 40,
      r: (2 + particleRng() * 3) * (sizeMul || 1), life: 0.45 + particleRng() * 0.25, age: 0, color: color || '#8a7a5a'
    });
  }
}
function particlesStep(dt) {
  const ps = GAME.particles;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.vx *= 0.96;
    if (p.age >= p.life) ps.splice(i, 1);
  }
}
function particlesDraw(ctx) {
  for (const p of GAME.particles) {
    const k = 1 - p.age / p.life;
    ctx.globalAlpha = k * 0.6; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * (1.6 - k * 0.6), p.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

    night: { skyTop: '#04070d', skyBottom: '#0a1410', sun: '#d8dde6', far: '#0b1613', mid: '#08130e', canopy: '#06100a', canopyHi: '#0a170e', trunk: '#050806',
             bamboo: '#0f1a0e', bambooDark: '#0a120a', grass: '#07120a', dirt: '#120d08', dirtDark: '#0a0705', root: '#040302', stone: '#1e1e1a', fore: '#040c07', mist: '#182420', rain: '#7f8c90' },

             bamboo: '#6d8c48', bambooDark: '#4b6636', grass: '#2b5232', dirt: '#3a2b1e', dirtDark: '#261b11', root: '#1a1208', stone: '#666459', fore: '#1c4429', mist: '#d8d2d4', rain: '#e6dcd6' }

  sky(ctx, pal, t, v) {

  },
  // Ko'olau: tall, fluted, near-vertical ridges — abs(sin) gives the knife-edge flutes.
  farRidge(ctx, pal, t, v) {

  },

        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 12, y + 10); ctx.quadraticCurveTo(x + 8, y - 2, x + 26, y + 11); ctx.stroke();
      } else if (sName === 'rock') {
        ctx.fillStyle = pal.stone;
        ctx.beginPath(); ctx.ellipse(x, y + 3, 9 + h * 12, 4 + h * 2, 0, 0, Math.PI * 2); ctx.fill();
        if (h > 0.5) { ctx.beginPath(); ctx.ellipse(x + 24, v.groundAt(x + 24) + 4, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); }
      } else if (sName === 'mud') {
        ctx.fillStyle = 'rgba(170,190,200,0.28)'; ctx.beginPath(); ctx.ellipse(x, y + 7, 16 + h * 14, 2.4, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = pal.dirtDark; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + 6 + h * 6, y + 10); ctx.lineTo(x + 2, y + 12); ctx.stroke();
      }
    }
    ctx.strokeStyle = pal.grass; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, v.groundAt(0));
    for (let x = 8; x <= v.W; x += 8) ctx.lineTo(x, v.groundAt(x));
    ctx.stroke();
  },
  // Foreground: hāpu'u fern and palm fronds sweeping past in front of Jon.
  foreground(ctx, pal, t, v) {
    const f = 1.45, spacing = 640, wx0 = v.scroll * f;
    const i0 = Math.floor(wx0 / spacing) - 1, i1 = Math.floor((wx0 + v.W) / spacing) + 1;
    ctx.fillStyle = pal.fore;
    for (let i = i0; i <= i1; i++) {
      const h = hash(i * 4201 + 5), x = i * spacing + h * 200 - wx0;
      const fromTop = h > 0.5, baseY = fromTop ? -20 : v.H + 20, dir = fromTop ? 1 : -1;
      for (let k = 0; k < 5; k++) {
        const a = (k - 2) * 0.26 + Math.sin(t * 0.7 + i + k) * 0.035, len = 130 + hash(i * 17 + k) * 90;
        const tipX = x + Math.sin(a) * len, tipY = baseY + Math.cos(a) * len * dir;
        ctx.beginPath(); ctx.moveTo(x, baseY);
        for (let s2 = 0.15; s2 < 1; s2 += 0.17) {                          // serrated frond edge
          const px = x + Math.sin(a) * len * s2, py = baseY + Math.cos(a) * len * s2 * dir, w = 22 * (1 - s2);
          ctx.lineTo(px + Math.cos(a) * w, py - Math.sin(a) * w * dir); ctx.lineTo(px + Math.cos(a) * w * 0.4 + Math.sin(a) * len * 0.05, py + Math.cos(a) * len * 0.05 * dir);
        }
        ctx.lineTo(tipX, tipY);
        for (let s2 = 0.95; s2 > 0.1; s2 -= 0.17) {
          const px = x + Math.sin(a) * len * s2, py = baseY + Math.cos(a) * len * s2 * dir, w = 22 * (1 - s2);
          ctx.lineTo(px - Math.cos(a) * w, py + Math.sin(a) * w * dir);
        }
        ctx.closePath(); ctx.fill();
      }
    }
  }
};

// Mist bands above the config's mist altitude, drifting slowly; alpha grows with height and rain.
function drawMist(ctx, pal, t, v, f, y, k) {
  const above = v.mistAmount; if (above <= 0.01) return;
  ctx.fillStyle = pal.mist; ctx.globalAlpha = 0.28 * above * k;
  for (let b = 0; b < 3; b++) {
    const yy = y + b * 26 + Math.sin(t * 0.3 + b) * 6, drift = (v.scroll * f * 0.5 + t * 12 + b * 400) % (v.W + 600) - 300;
    ctx.beginPath(); ctx.ellipse(drift, yy, 320, 14 + b * 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(drift + 700, yy + 8, 260, 12, 0, 0, Math.PI * 2); ctx.fill();
  }

// ===== MODULE: atmosphere =====
// Sun/moon clocks, stars, shooting stars, rain, ambient life, foot dust. Decoration only — nothing here touches play.
const ATMO = {
  STARS: 150, STAR_TOP: 330,
  SHOOT_MIN_S: 120, SHOOT_MAX_S: 240, SHOOT_LEN_S: 0.7,
  BUTTERFLIES: [2, 4], FIREFLIES: [10, 20], MOTHS: 3,
  BIRD_EVERY_S: [20, 40], BAT_EVERY_S: [25, 50],
  RAIN_DROPS: 140, RAIN_SPEED: 900
};
const parseHM = s => { const [h, m] = s.split(':').map(Number); return h + m / 60; };
function skyBodyFrac(hour, from, to) {                  // 0..1 along the arc, or null when below the horizon
  let h = hour; if (to > 24 && h < from) h += 24;
  const f = (h - from) / (to - from);
  return f >= -0.03 && f <= 1.03 ? clamp(f, 0, 1) : null;
}
function skyBodyPos(f, v) { return { x: 80 + f * (v.W - 160), y: 330 - Math.sin(f * Math.PI) * 260 }; }

// Palette keyframes and night amount derive from the course's sunrise/sunset (Design Bible §8 atmosphere rule 2).
function dayKeys(course) {
  const r = parseHM(course.sun.rise), s = parseHM(course.sun.set);
  return [[r - 1.1, 'night'], [r - 0.35, 'dawn'], [r + 0.5, 'day'], [s - 0.6, 'day'], [s + 0.1, 'dusk'], [s + 1.0, 'night']];
}
function dayBlend(hour) {
  const keys = dayKeys(GAME.course), n = keys.length;
  for (let i = 0; i < n; i++) {
    const [h0, a] = keys[i], [h1raw, b] = keys[(i + 1) % n];
    const h1 = h1raw <= h0 ? h1raw + 24 : h1raw;
    let h = hour; if (h < h0) h += 24;
    if (h >= h0 && h <= h1) return { a, b, t: (h - h0) / (h1 - h0) };
  }
  return { a: 'night', b: 'night', t: 0 };
}
function nightAmount(hour) {
  const r = parseHM(GAME.course.sun.rise), s = parseHM(GAME.course.sun.set);
  let h = hour; if (h < r - 1.1) h += 24;
  if (h >= r + 0.5 && h <= s - 0.6) return 0;
  if (h > s - 0.6 && h < s + 1.0) return (h - (s - 0.6)) / 1.6;
  if (h > r - 1.1 + 24 && h < r + 0.5 + 24) return 1 - (h - (r - 1.1 + 24)) / 1.6;
  if (h > r - 1.1 && h < r + 0.5) return 1 - (h - (r - 1.1)) / 1.6;
  return 1;
}
function middayAmount(hour) {
  const r = parseHM(GAME.course.sun.rise), s = parseHM(GAME.course.sun.set);
  return hour > r && hour < s ? Math.sin((hour - r) / (s - r) * Math.PI) : 0;
}

// --- stars ---
const starRng = rng(0x57a5);
const STARS = Array.from({ length: ATMO.STARS }, () => ({ x: starRng(), y: starRng(), r: 0.6 + starRng() * 1.3, ph: starRng() * 6.28, f: 0.8 + starRng() * 2.2 }));
function drawStars(ctx, t, v) {
  const a = Math.pow(GAME.night, 1.5); if (a <= 0.01) return;
  ctx.fillStyle = '#eef2ff';
  for (const s of STARS) {
    const tw = 0.55 + 0.45 * Math.sin(t * s.f + s.ph);
    ctx.globalAlpha = a * tw; ctx.beginPath(); ctx.arc(s.x * v.W, s.y * ATMO.STAR_TOP, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const sh = GAME.shooting;
  if (sh && sh.age < ATMO.SHOOT_LEN_S) {
    const k = sh.age / ATMO.SHOOT_LEN_S, x = sh.x + sh.vx * sh.age, y = sh.y + sh.vy * sh.age;
    ctx.strokeStyle = `rgba(240,244,255,${(1 - k) * a})`; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - sh.vx * 0.18, y - sh.vy * 0.18); ctx.lineTo(x, y); ctx.stroke();
  }
}
const atmoRng = rng(0xa7a0);
function atmoStep(dt, tReal) {
  // shooting star: real-time schedule, night only, one streak
  if (GAME.nextShoot === undefined) GAME.nextShoot = tReal + lerp(ATMO.SHOOT_MIN_S, ATMO.SHOOT_MAX_S, atmoRng());
  if (GAME.shooting) { GAME.shooting.age += dt; if (GAME.shooting.age > ATMO.SHOOT_LEN_S) GAME.shooting = null; }
  else if (tReal >= GAME.nextShoot) {
    GAME.nextShoot = tReal + lerp(ATMO.SHOOT_MIN_S, ATMO.SHOOT_MAX_S, atmoRng());
    if (GAME.night > 0.6) GAME.shooting = { x: 200 + atmoRng() * (ENGINE.W - 400), y: 40 + atmoRng() * 180, vx: -(500 + atmoRng() * 300), vy: 160 + atmoRng() * 120, age: 0 };
  }
  // rain: seeded squall windows along the course, with ramps; mist above the config altitude
  const c = GAME.course, wx = (c.hazards && c.hazards.weather) || [];
  const squall = wx.find(w => w.type === 'rainSquall'), mist = wx.find(w => w.type === 'mist');
  let rainTarget = 0;
  if (squall) {
    const seg = 0.5, i = Math.floor(GAME.mile / seg), u = (GAME.mile - i * seg) / seg;
    const here = hash(i * 977 + 11) < squall.chancePerMile * seg * 4;          // chance per half-mile window
    if (here) rainTarget = clamp(Math.min(u, 1 - u) * 6, 0, 1);
  }
  GAME.rain = lerpTo(GAME.rain, rainTarget, dt, 1.2);
  GAME.mistAmount = mist ? clamp((GAME.elev - mist.aboveFeet) / 300, 0, 1) * (0.6 + 0.4 * GAME.rain) : 0;
  lifeStep(dt);
}
function drawRain(ctx, pal, v) {
  const r = GAME.rain; if (r < 0.02) return;
  ctx.strokeStyle = pal.rain; ctx.globalAlpha = 0.35 * r; ctx.lineWidth = 1.2;
  const n = Math.floor(ATMO.RAIN_DROPS * r), tt = GAME.t;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const h = hash(i * 131 + 7), h2 = hash(i * 173 + 3);
    const x = ((h * v.W + tt * -160 * (0.6 + h2)) % v.W + v.W) % v.W;
    const y = ((h2 * v.H + tt * ATMO.RAIN_SPEED * (0.7 + h * 0.6)) % (v.H + 40)) - 20;
    ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 16);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = pal.mist; ctx.globalAlpha = 0.10 * r; ctx.fillRect(0, 0, v.W, v.H); ctx.globalAlpha = 1;
}

// --- ambient life ---
function lifeStep(dt) {
  const L = GAME.life, kit = BIOMES[GAME.course.biome], day = GAME.night < 0.5;
  const count = type => L.filter(e => e.type === type).length;
  const W = ENGINE.W, H = ENGINE.H;
  // population targets by time of day
  const wantB = day ? Math.round(lerp(ATMO.BUTTERFLIES[0], ATMO.BUTTERFLIES[1], hash(Math.floor(GAME.mile)))) : 0;
  const wantF = !day ? Math.round(lerp(ATMO.FIREFLIES[0], ATMO.FIREFLIES[1], hash(Math.floor(GAME.mile) + 9))) : 0;
  const wantM = !day && GAME.night > 0.8 ? ATMO.MOTHS : 0;
  if (kit.life.day.includes('butterfly') && count('butterfly') < wantB) L.push({ type: 'butterfly', x: W + 30, y: 250 + atmoRng() * 120, ph: atmoRng() * 6, hue: Math.floor(atmoRng() * 3), age: 0 });
  if (kit.life.night.includes('firefly') && count('firefly') < wantF) L.push({ type: 'firefly', x: atmoRng() * W, y: 300 + atmoRng() * 180, ph: atmoRng() * 6, layer: atmoRng() < 0.6 ? 1 : 1.45, age: 0 });
  if (kit.life.night.includes('moth') && count('moth') < wantM) L.push({ type: 'moth', x: 0, y: 0, ph: atmoRng() * 6, age: 0 });
  GAME.nextBird = GAME.nextBird ?? GAME.t + lerp(...ATMO.BIRD_EVERY_S, atmoRng());
  GAME.nextBat = GAME.nextBat ?? GAME.t + lerp(...ATMO.BAT_EVERY_S, atmoRng());
  if (day && kit.life.day.includes('bird') && GAME.t > GAME.nextBird) { GAME.nextBird = GAME.t + lerp(...ATMO.BIRD_EVERY_S, atmoRng()); L.push({ type: 'bird', x: W + 40, y: 60 + atmoRng() * 140, ph: 0, age: 0 }); }
  if (!day && kit.life.night.includes('bat') && GAME.t > GAME.nextBat) { GAME.nextBat = GAME.t + lerp(...ATMO.BAT_EVERY_S, atmoRng()); L.push({ type: 'bat', x: W + 40, y: 70 + atmoRng() * 120, ph: 0, age: 0 }); }

  for (let i = L.length - 1; i >= 0; i--) {
    const e = L[i]; e.age += dt; e.ph += dt;
    if (e.type === 'butterfly') { e.x -= (GAME.speed * 0.45 + 25) * dt; e.y += Math.sin(e.ph * 2.3) * 22 * dt; if (e.x < -40 || !day) L.splice(i, 1); }
    else if (e.type === 'bird') { e.x -= (GAME.speed * 0.05 + 170) * dt; e.y += Math.sin(e.ph * 1.5) * 8 * dt; if (e.x < -60) L.splice(i, 1); }
    else if (e.type === 'firefly') { e.x -= GAME.speed * e.layer * dt - Math.sin(e.ph * 1.7) * 18 * dt; e.y += Math.cos(e.ph * 1.3) * 14 * dt; if (e.x < -20) e.x = W + 20; if (day) L.splice(i, 1); }
    else if (e.type === 'moth') { if (GAME.night < 0.5) L.splice(i, 1); }
    else if (e.type === 'bat') { e.x -= (GAME.speed * 0.05 + 260) * dt; e.y += Math.sin(e.ph * 4) * 30 * dt; if (e.x < -60) L.splice(i, 1); }
  }
}
function drawLife(ctx, t, layer, v) {
  for (const e of GAME.life) {
    if (layer === 'sky' && e.type === 'bird') {
      const flap = Math.sin(t * 9 + e.ph) * 6;
      ctx.strokeStyle = 'rgba(30,40,40,0.75)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x - 12, e.y - flap); ctx.quadraticCurveTo(e.x - 4, e.y + 2, e.x, e.y); ctx.quadraticCurveTo(e.x + 4, e.y + 2, e.x + 12, e.y - flap); ctx.stroke();
    } else if (layer === 'sky' && e.type === 'bat') {
      const flap = Math.sin(t * 16 + e.ph) * 7;
      ctx.fillStyle = 'rgba(8,10,14,0.9)';
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.quadraticCurveTo(e.x - 8, e.y - 6 - flap, e.x - 16, e.y - flap); ctx.quadraticCurveTo(e.x - 9, e.y + 4, e.x, e.y + 3);
      ctx.quadraticCurveTo(e.x + 9, e.y + 4, e.x + 16, e.y - flap); ctx.quadraticCurveTo(e.x + 8, e.y - 6 - flap, e.x, e.y); ctx.fill();
    } else if (layer === 'mid' && e.type === 'butterfly') {
      const wing = Math.abs(Math.sin(t * 11 + e.ph)) * 7 + 2, col = ['#e8a23a', '#f2e6c8', '#d9773a'][e.hue];
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(e.x - wing * 0.6, e.y, wing, 4, -0.4, 0, Math.PI * 2); ctx.ellipse(e.x + wing * 0.6, e.y, wing, 4, 0.4, 0, Math.PI * 2); ctx.fill();
    } else if ((layer === 'near' && e.type === 'firefly' && e.layer === 1) || (layer === 'fore' && e.type === 'firefly' && e.layer > 1)) {
      const blink = Math.max(0, Math.sin(t * 2.2 + e.ph * 3)) ** 3 * GAME.night;
      if (blink < 0.05) continue;
      const r = e.layer > 1 ? 4 : 3;
      ctx.fillStyle = `rgba(200,240,120,${0.25 * blink})`; ctx.beginPath(); ctx.arc(e.x, e.y, r * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(230,255,170,${blink})`; ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    } else if (layer === 'fore' && e.type === 'moth') {
      const hs = GAME.jon.headScreen, ang = e.ph * 3.1 + e.ph * 0.7, rr = 40 + Math.sin(e.ph * 2.3) * 22;
      const x = hs.x + 60 + Math.cos(ang) * rr, y = hs.y - 10 + Math.sin(ang * 1.3) * rr * 0.6, flap = Math.abs(Math.sin(t * 20 + e.ph)) * 3 + 1;
      ctx.fillStyle = `rgba(230,220,190,${0.6 * GAME.night})`;
      ctx.beginPath(); ctx.ellipse(x - flap, y, flap, 1.8, 0, 0, Math.PI * 2); ctx.ellipse(x + flap, y, flap, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// --- foot dust: each footfall spawns dust by surface `dust`, more with speed and on descents; mud splats instead ---
function footfalls(j, J) {
  if (j.state !== 'run' || !j.grounded) { j.footBeat = null; return; }
  const beat = Math.floor((j.phase - Math.PI / 2) / Math.PI);
  if (j.footBeat === null || j.footBeat === undefined) { j.footBeat = beat; return; }
  if (beat === j.footBeat) return;
  j.footBeat = beat;
  const scale = JON.TARGET_PX / JON.FIGURE_UNITS, ankle = beat % 2 === 0 ? J.nAnkle : J.fAnkle;
  const sx = JON.X + ankle.x * scale, gy = RENDER.GROUND_Y + GAME.camY;
  const surf = SURFACES[GAME.surface];
  if (surf.dust === 0) { spawnDust(sx, gy, 2, '#2a1e12', 1.4); }                    // mud splat
  else {
    const n = Math.round(surf.dust * (1.5 + GAME.animSpeed / 140) * (j.gait === 'down' ? 1.6 : 1));
    if (n > 0) spawnDust(sx, gy, n);
  }
  AudioBed.footstep(GAME.surface);
}

              nearSh: 0.35, nearEl: 2.55, farSh: -0.8, farEl: 1.9, windMul: 0.05, poleAng: 0.9, poleSplit: 1, beardFly: 0, poleUp: 0 },
  // finish: poles raised overhead in a V (character sheet §6.10)
  finish:   { hipY: -62, lean: 0.0, headPitch: -0.35, nearHip: 0.25, nearKnee: 0.15, farHip: -0.25, farKnee: 0.15,
              nearSh: 2.7, nearEl: 0.3, farSh: 2.9, farEl: 0.2, windMul: 0.2, poleAng: 0, poleSplit: 0, beardFly: 0, poleUp: 1 },
  // DNF: sits on a rock, head down
  sit:      { hipY: -30, lean: 0.3, headPitch: 0.55, nearHip: 1.35, nearKnee: 1.25, farHip: 1.15, farKnee: 1.4,
              nearSh: 0.85, nearEl: 0.9, farSh: 0.7, farEl: 1.0, windMul: 0.02, poleAng: 0.9, poleSplit: 0, beardFly: 0, poleUp: 0 }
};

function blendPose(j, target, dt) {
  for (const k in target) j.pose[k] = lerpTo(j.pose[k], target[k], dt, JON.POSE_RATE);
}

function jonStep(j, dt) {
  const now = performance.now();
  j.prevY = j.y;

  const canJump = (j.grounded || (!j.jumpedSinceGround && (now - j.lastGroundedAt) <= ENGINE.COYOTE_MS)) && j.stumbleT <= 0 && !j.forcedState && GAME.screen === 'race';
  if (Input.jumpBuffered(now) && canJump) {
    j.vy = JON.JUMP_V * (GAME.jumpMul || 1); j.grounded = false; j.jumpedSinceGround = true; j.holding = true;
    Input.consumeJump();
  }
  if (!Input.jumpHeld) j.holding = false;

  if (!j.grounded) {
    let g = (j.holding && j.vy > 0) ? JON.G_HOLD : JON.G_FULL;
    if (Input.duckHeld) g = JON.G_FASTFALL;
    j.vy -= g * dt; j.y += j.vy * dt;
    if (j.y <= 0) {
      j.y = 0; j.vy = 0; j.grounded = true; j.jumpedSinceGround = false; j.landedAt = now;
      spawnDust(JON.X, RENDER.GROUND_Y + GAME.camY, 7);
    }
  } else j.lastGroundedAt = now;

  const ducking = j.grounded && Input.duckHeld;
  j.state = j.forcedState && j.grounded ? j.forcedState : !j.grounded ? (j.vy > 0 ? 'jumpUp' : 'jumpDown') : j.stumbleT > 0 ? 'stumble' : ducking ? 'duck' : 'run';
  if (j.state === 'run') j.phase += dt * GAME.animSpeed / JON.STRIDE_PX * Math.PI * 2;
  else if (j.state === 'duck' || j.state === 'stumble') j.phase += dt * 1.5;

  blendPose(j, j.state === 'run' ? gaitPose(j.phase, j.gait) : POSES[j.state], dt);
  const J = jonJoints(j.pose, j.grounded);
  hairStep(j, J, dt, GAME.animSpeed * j.pose.windMul);
  polePlantPuffs(j, J);
  footfalls(j, J);
}

// A pole plants each half stride on climbs: puff where its tip meets the trail.
function polePlantPuffs(j, J) {
  if (!JON.POLES || j.gait !== 'up' || j.state !== 'run' || j.pose.poleSplit < 0.5) { j.plantBeat = null; return; }
  const beat = Math.floor((j.phase + Math.PI / 2) / Math.PI);          // sin(phase) extremes = plant moments
  if (j.plantBeat === null || j.plantBeat === undefined) { j.plantBeat = beat; return; }
  if (beat === j.plantBeat) return;
  j.plantBeat = beat;
  const scale = JON.TARGET_PX / JON.FIGURE_UNITS;
  const hand = (beat % 2 === 0) ? J.nHand : J.fHand, ang = 0.45 + 0.35 * Math.sin(j.phase) * ((beat % 2 === 0) ? 1 : -1);
  const len = Math.max(20, (-(hand.y + J.dy) - 6) / Math.cos(ang)), tip = seg(hand, len, ang);
  spawnDust(JON.X + tip.x * scale, RENDER.GROUND_Y + GAME.camY, 3);
}

// --- drawing helpers ---
function drawLimb(ctx, a, b, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function drawShoe(ctx, ankle, shinAng) {
  ctx.save();
  ctx.translate(ankle.x, ankle.y + 1);
  ctx.rotate(clamp(-shinAng * 0.35, -0.5, 0.5));
  ctx.fillStyle = JON_PAL.black;
  ctx.fillRect(-4.5, -7, 9, 6);                                 // ankle sock
  ctx.beginPath(); ctx.roundRect(-7, -2, 19, 7, [3, 5, 2, 2]); ctx.fill();   // shoe, one dark shape
  ctx.restore();
}
// Forearm sleeve = three bold ink bands. Reads as "tattooed" without line-work noise.
function inkSleeve(ctx, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  ctx.strokeStyle = JON_PAL.ink; ctx.lineWidth = 2.4; ctx.lineCap = 'butt';
  ctx.beginPath();
  for (const s of [0.28, 0.5, 0.72]) {
    const px = a.x + dx * s, py = a.y + dy * s;
    ctx.moveTo(px - nx * 4, py - ny * 4); ctx.lineTo(px + nx * 4, py + ny * 4);
  }
  ctx.stroke();
}
// Left-shin dagger as one dark mark.
function inkDagger(ctx, knee, ankle) {
  const dx = ankle.x - knee.x, dy = ankle.y - knee.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const at = s => ({ x: knee.x + dx * s, y: knee.y + dy * s });
  const grip = at(0.14), guard = at(0.26), tip = at(0.62);
  ctx.strokeStyle = JON_PAL.ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(grip.x, grip.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(guard.x - nx * 3.8, guard.y - ny * 3.8); ctx.lineTo(guard.x + nx * 3.8, guard.y + ny * 3.8); ctx.stroke();
  ctx.fillStyle = JON_PAL.ink;
  ctx.beginPath();
  ctx.moveTo(tip.x - nx * 2.4 - dx / L * 4, tip.y - ny * 2.4 - dy / L * 4);
  ctx.lineTo(tip.x + nx * 2.4 - dx / L * 4, tip.y + ny * 2.4 - dy / L * 4);
  ctx.lineTo(tip.x + dx / L * 2.5, tip.y + dy / L * 2.5); ctx.fill();
}
function inkThighMark(ctx, hip, knee) {
  const s = 0.74, x = hip.x + (knee.x - hip.x) * s, y = hip.y + (knee.y - hip.y) * s;
  ctx.fillStyle = JON_PAL.ink; ctx.fillRect(x - 3.5, y - 2.5, 7, 5);
}

// ---- hair: simulated verlet chains, no hand posing ----
// Frame: Jon's figure units, x forward, y down, origin at the feet, ground at y = 0 (so jumps move the anchor).
const HAIRSIM = {
  N: 10, SEG: 5.2,             // 10 points, 9 links ≈ 47 units → ends land at mid-back
  G: 800,                      // gravity, units/s²
  WIND_K: 1.9,                 // back-wind per px/s of scroll speed (300 px/s → 35° hang)
  AIR_WIND: 260,               // extra back-wind while airborne
  FALL_LIFT: 0.8,              // upward push per unit/s of fall speed
  DAMP: 0.94, ITER: 4,
  LOCK_N: 5, LOCK_SEG: 5, LOCK_WIND: 0.12, LOCK_DAMP: 0.88,
  W_SCALP: 4, W_FULL: 7.5, W_END: 4.5,   // ribbon half-widths
  BUMPS: 3, BUMP_AMP: 3
};
function chainInit(n, seg, ax, ay) {
  const pts = [];
  for (let i = 0; i < n; i++) pts.push({ x: ax, y: ay + i * seg, px: ax, py: ay + i * seg });
  return pts;
}
function hairInit() {
  return {
    main: chainInit(HAIRSIM.N, HAIRSIM.SEG, -7, -117),
    near: chainInit(HAIRSIM.LOCK_N, HAIRSIM.LOCK_SEG, -4, -120),
    far:  chainInit(HAIRSIM.LOCK_N, HAIRSIM.LOCK_SEG, -9, -122)
  };
}
// One verlet step for a pinned chain. clampFn(p) keeps points behind the neck line and above the ground.
function chainStep(pts, ax, ay, accX, accY, seg, damp, dt, clampFn) {
  pts[0].px = pts[0].x; pts[0].py = pts[0].y; pts[0].x = ax; pts[0].y = ay;
  const dt2 = dt * dt;
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i];
    const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
    p.px = p.x; p.py = p.y;
    p.x += vx + accX * dt2; p.y += vy + accY * dt2;
  }
  for (let k = 0; k < HAIRSIM.ITER; k++) {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 0.0001;
      const diff = (L - seg) / L;
      if (i === 1) { b.x -= dx * diff; b.y -= dy * diff; }
      else { a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; }
    }
    for (let i = 1; i < pts.length; i++) clampFn(pts[i]);
  }
}
// Steps all three chains from the current joints. windPx = scroll speed in px/s (already gait-scaled).
function hairStep(j, J, dt, windPx) {
  const h = j.hair, s = JON.TARGET_PX / JON.FIGURE_UNITS;
  const groundOff = j.y / s;                         // feet height above ground, figure units
  const oy = J.dy - groundOff;                       // local-frame → ground-frame
  const head = J.head, hip = J.hip;
  const ax = head.x - 7, ay = head.y + 7 + oy;       // nape of the hair helmet
  const backBottomX = hip.x - 9, backBottomY = hip.y + oy;
  const backX = y => lerp(ax, backBottomX, clamp((y - ay) / (backBottomY - ay || 1), 0, 1.4));
  const clampMain = p => { p.x = Math.min(p.x, backX(p.y) + 1); p.y = Math.min(p.y, -2); };
  const clampLock = p => { p.y = Math.min(p.y, -2); };

  let accX = -windPx * HAIRSIM.WIND_K, accY = HAIRSIM.G;
  if (!j.grounded) {
    accX -= HAIRSIM.AIR_WIND;
    if (j.vy < 0) accY -= Math.min(650, (-j.vy / s) * HAIRSIM.FALL_LIFT);
  }
  chainStep(h.main, ax, ay, accX, accY, HAIRSIM.SEG, HAIRSIM.DAMP, dt, clampMain);
  chainStep(h.near, head.x - 4, head.y + 4 + oy, accX * HAIRSIM.LOCK_WIND, HAIRSIM.G, HAIRSIM.LOCK_SEG, HAIRSIM.LOCK_DAMP, dt, clampLock);
  chainStep(h.far,  head.x - 9, head.y + 2 + oy, accX * HAIRSIM.LOCK_WIND, HAIRSIM.G, HAIRSIM.LOCK_SEG, HAIRSIM.LOCK_DAMP, dt, clampLock);
}
// Catmull-Rom resample of a chain into a smooth centreline.
function resample(pts, per) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3)
      });
    }
  }
  out.push({ x: pts[pts.length - 1].x, y: pts[pts.length - 1].y });
  return out;
}
// ONE tapered ribbon along the main chain, soft 3-bump end. oy converts ground-frame back to the drawing frame.
function drawHairRibbon(ctx, chain, oy, t) {
  const c = resample(chain, 4), N = c.length - 1, nrm = [];
  for (let i = 0; i <= N; i++) {
    const a = c[Math.min(i + 1, N)], b = c[Math.max(i - 1, 0)];
    const tx = a.x - b.x, ty = a.y - b.y, L = Math.hypot(tx, ty) || 1;
    nrm.push({ x: -ty / L, y: tx / L });
  }
  const halfW = s => s < 0.15 ? lerp(HAIRSIM.W_SCALP, HAIRSIM.W_FULL, s / 0.15) : lerp(HAIRSIM.W_FULL, HAIRSIM.W_END, (s - 0.15) / 0.85);
  ctx.fillStyle = JON_PAL.brown;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) { const w = halfW(i / N); ctx.lineTo(c[i].x - nrm[i].x * w, c[i].y - nrm[i].y * w + oy); }
  const e = c[N], n = nrm[N], w = halfW(1);
  const dx = e.x - c[N - 1].x, dy = e.y - c[N - 1].y, dL = Math.hypot(dx, dy) || 1, ux = dx / dL, uy = dy / dL;
  for (let k = 1; k < 9; k++) {
    const u = k / 9, side = -w * (1 - 2 * u);
    const bump = HAIRSIM.BUMP_AMP * (0.5 + 0.5 * Math.sin(u * Math.PI * 2 * HAIRSIM.BUMPS + t)) * Math.sin(u * Math.PI);
    ctx.lineTo(e.x + n.x * side + ux * bump, e.y + n.y * side + uy * bump + oy);
  }
  for (let i = N; i >= 0; i--) { const w2 = halfW(i / N); ctx.lineTo(c[i].x + nrm[i].x * w2, c[i].y + nrm[i].y * w2 + oy); }
  ctx.closePath(); ctx.fill();
}
// Front lock: tapered stroke along its chain.
function drawLock(ctx, chain, oy, w0, shade) {
  const c = resample(chain, 3);
  for (let i = 0; i < c.length - 1; i++) {
    const w = lerp(w0, 2, i / (c.length - 2));
    ctx.strokeStyle = JON_PAL.brown; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c[i].x, c[i].y + oy); ctx.lineTo(c[i + 1].x, c[i + 1].y + oy); ctx.stroke();
    if (shade) { ctx.strokeStyle = JON_PAL.shade; ctx.stroke(); }
  }
}

// Joint positions in figure units from a pose. dy grounds the lowest foot.
function jonJoints(P, grounded) {
  const hip = { x: 0, y: P.hipY };
  const shoulder = seg(hip, -40, -P.lean);
  const neck = seg(shoulder, -5, -P.lean);
  const head = seg(neck, -12, -(P.lean + P.headPitch));
  const nKnee = seg(hip, 30, P.nearHip), nAnkle = seg(nKnee, 30, P.nearHip - P.nearKnee);
  const fKnee = seg(hip, 30, P.farHip),  fAnkle = seg(fKnee, 30, P.farHip - P.farKnee);
  const nElbow = seg(shoulder, 22, P.nearSh), nHand = seg(nElbow, 20, P.nearSh + P.nearEl);
  const fElbow = seg(shoulder, 22, P.farSh),  fHand = seg(fElbow, 20, P.farSh + P.farEl);
  const dy = grounded ? -(Math.max(nAnkle.y, fAnkle.y) + 6) : 0;
  return { hip, shoulder, neck, head, nKnee, nAnkle, fKnee, fAnkle, nElbow, nHand, fElbow, fHand, dy };
}

// Draws Jon with feet at (x, groundY) in screen space. `scale` maps figure units to px.
// yUpPx = drawn height above ground, used to map the ground-frame hair back onto the body.
function drawJon(ctx, pal, t, j, x, groundY, scale, yUpPx, opts) {
  opts = opts || {};
  const P = j.pose;
  const J = jonJoints(P, j.grounded);
  const { hip, shoulder, neck, head, nKnee, nAnkle, fKnee, fAnkle, nElbow, nHand, fElbow, fHand, dy } = J;
  const hairOy = (yUpPx || 0) / scale - dy;        // ground-frame → drawing frame (which already has dy applied)
  j.headScreen = { x: x + head.x * scale, y: groundY + (head.y + dy) * scale };   // for the headlamp cone

  const sinceLand = j.landedAt >= 0 ? (performance.now() - j.landedAt) / 1000 : 9;
  const squash = sinceLand < JON.LAND_SQUASH_S ? 1 - 0.2 * Math.sin((sinceLand / JON.LAND_SQUASH_S) * Math.PI) : 1;
  // Beard: stride timing, half a beat behind the head; flies back on descents and in the air.
  const beardSway = Math.sin(j.phase * 2 - Math.PI / 2) * 1.6 - P.beardFly * 2.5;
  const beardLift = P.beardFly * 0.12;

  ctx.save();
  ctx.translate(x, groundY);
  ctx.scale(scale, scale);
  ctx.translate(0, dy);
  if (j.state === 'sit') {                                                    // the rock
    ctx.fillStyle = '#6b6656'; ctx.beginPath(); ctx.ellipse(-6, -14, 30, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(-6, -8, 30, 10, 0, 0, Math.PI); ctx.fill();
  }

  // 1. hair ribbon (behind everything) and the far-side front lock
  drawHairRibbon(ctx, j.hair.main, hairOy, t);
  drawLock(ctx, j.hair.far, hairOy, 3.2, true);

  // 2. far arm
  drawLimb(ctx, shoulder, fElbow, 8, pal.skin);
  drawLimb(ctx, fElbow, fHand, 7, pal.skin);
  inkSleeve(ctx, fElbow, fHand);
  drawLimb(ctx, shoulder, fElbow, 8, pal.shade);
  drawLimb(ctx, fElbow, fHand, 7, pal.shade);

  // 3. far leg
  drawLimb(ctx, hip, fKnee, 10, pal.skin);
  drawLimb(ctx, fKnee, fAnkle, 8.5, pal.skin);
  drawLimb(ctx, hip, fKnee, 10, pal.shade);
  drawLimb(ctx, fKnee, fAnkle, 8.5, pal.shade);
  drawShoe(ctx, fAnkle, P.farHip - P.farKnee);

  // poles: planted one per hand on climbs; raised in a V at the finish; otherwise bunched in the trailing hand, behind the torso
  if (JON.POLES) {
    if (P.poleUp > 0.5) drawRaisedPole(ctx, pal, fHand, -0.5, true);
    else if (P.poleSplit > 0.5) drawPlantedPole(ctx, pal, fHand, 0.45 - 0.35 * Math.sin(j.phase), true);
    else drawCarriedPoles(ctx, pal, fHand, P.poleAng);
  }

  // 5. torso: tee, then vest as the single brightest block
  ctx.save();
  ctx.translate(hip.x, hip.y); ctx.rotate(P.lean);
  ctx.fillStyle = pal.offwhite;
  ctx.beginPath(); ctx.roundRect(-10, -44, 20, 50, 6); ctx.fill();
  const bounce = Math.abs(Math.sin(j.phase)) * 0.8;
  ctx.fillStyle = pal.vest;
  ctx.beginPath(); ctx.roundRect(-10.5, -45 + bounce, 24, 31, [5, 7, 5, 4]); ctx.fill();
  ctx.fillStyle = pal.offwhite;                                 // one flask, front pocket
  ctx.beginPath(); ctx.roundRect(8.5, -41 + bounce, 5, 13, 2); ctx.fill();
  ctx.restore();
  drawLock(ctx, j.hair.near, hairOy, 3.8, false);            // near-side front lock, in front of the strap

  // 6. near leg
  drawLimb(ctx, hip, nKnee, 10.5, pal.skin);
  drawLimb(ctx, nKnee, nAnkle, 9, pal.skin);
  inkThighMark(ctx, hip, nKnee);
  inkDagger(ctx, nKnee, nAnkle);
  drawShoe(ctx, nAnkle, P.nearHip - P.nearKnee);

  // 7. split shorts, bib on the near thigh
  const shortsLeg = (knee, dark) => {
    const dx = knee.x - hip.x, dy2 = knee.y - hip.y, L = Math.hypot(dx, dy2) || 1;
    const nx = -dy2 / L * 7, ny = dx / L * 7, hem = 0.56;
    ctx.fillStyle = pal.pink;
    ctx.beginPath();
    ctx.moveTo(hip.x - nx - 3, hip.y - ny - 6); ctx.lineTo(hip.x + nx + 3, hip.y + ny - 6);
    ctx.lineTo(hip.x + dx * hem + nx * 1.05, hip.y + dy2 * hem + ny * 1.05);
    ctx.lineTo(hip.x + dx * (hem - 0.06) - nx * 1.05, hip.y + dy2 * (hem - 0.06) - ny * 1.05);
    ctx.closePath(); ctx.fill();
    if (dark) { ctx.fillStyle = pal.shade; ctx.fill(); }
  };
  shortsLeg(fKnee, true);
  shortsLeg(nKnee, false);
  ctx.fillStyle = pal.pink; ctx.beginPath(); ctx.roundRect(hip.x - 10, hip.y - 8, 20, 9, 3); ctx.fill();
  {
    const s = 0.38, bx = hip.x + (nKnee.x - hip.x) * s, by = hip.y + (nKnee.y - hip.y) * s;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(-P.nearHip);
    ctx.fillStyle = pal.bib; ctx.fillRect(-5, -3.5, 10, 7);
    ctx.fillStyle = pal.black; ctx.font = 'bold 5px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(JON.BIB, 0, 0.4);
    ctx.restore();
  }

  // 8. near arm, tee sleeve, ink sleeve, poles
  drawLimb(ctx, shoulder, nElbow, 8.5, pal.skin);
  drawLimb(ctx, shoulder, seg(shoulder, 11, P.nearSh), 12, pal.offwhite);
  drawLimb(ctx, nElbow, nHand, 7.5, pal.skin);
  inkSleeve(ctx, nElbow, nHand);
  if (JON.POLES && P.poleUp > 0.5) drawRaisedPole(ctx, pal, nHand, 0.5, false);
  else if (JON.POLES && P.poleSplit > 0.5) drawPlantedPole(ctx, pal, nHand, 0.45 + 0.35 * Math.sin(j.phase), false);
  ctx.fillStyle = pal.skin; ctx.beginPath(); ctx.arc(nHand.x, nHand.y, 4, 0, Math.PI * 2); ctx.fill();

  // 9. neck, head
  drawLimb(ctx, shoulder, neck, 8, pal.skin);
  ctx.fillStyle = pal.skin; ctx.beginPath(); ctx.arc(head.x, head.y, 12, 0, Math.PI * 2); ctx.fill();
  // hair helmet: brow line over the crown to the nape, one filled shape; the cap sits on top of it
  ctx.fillStyle = pal.brown;
  ctx.beginPath();
  ctx.moveTo(head.x + 7.2, head.y - 10.6);                                   // brow line
  ctx.arc(head.x, head.y, 12.8, -Math.PI / 2 + 0.6, Math.PI / 2 + 0.35, true);   // over the crown, down the back
  ctx.lineTo(head.x - 6.5, head.y + 4); ctx.lineTo(head.x - 2, head.y - 4);  // hairline behind the glasses
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal.skin;
  ctx.beginPath(); ctx.arc(head.x + 11.8, head.y + 3.5, 3, 0, Math.PI * 2); ctx.fill();   // nose

  // 10. beard: one mass hung well below the glasses, leaving a cheek + nose skin window
  ctx.save();
  ctx.translate(head.x + 2 + beardSway, head.y + 9); ctx.rotate(-beardLift); ctx.scale(1, squash);
  ctx.fillStyle = pal.brown;
  ctx.beginPath();
  ctx.moveTo(7, -1);
  ctx.quadraticCurveTo(12, 5, 9.5, 12);
  ctx.quadraticCurveTo(6.5, 19.5, 0.5, 21);
  ctx.quadraticCurveTo(-6, 19.5, -7.5, 12);
  ctx.quadraticCurveTo(-9, 4, -6.5, -1.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // 11. shield glasses: one blue shape on the face by day; pushed up onto the cap bill at dusk
  if (!opts.glassesOnCap) {
    ctx.fillStyle = pal.blue;
    ctx.beginPath(); ctx.moveTo(head.x - 4, head.y - 5.5); ctx.lineTo(head.x + 13.5, head.y - 5);
    ctx.lineTo(head.x + 14.5, head.y + 1.5); ctx.lineTo(head.x - 3, head.y + 2.5); ctx.closePath(); ctx.fill();
  }

  // 12. cap: the silhouette. Green mesh back, off-white front, green bill leading.
  ctx.save();
  ctx.translate(head.x, head.y - 3.5); ctx.rotate((P.lean + P.headPitch) * 0.6);
  ctx.fillStyle = pal.green;
  ctx.beginPath(); ctx.arc(0, 0, 14, Math.PI, Math.PI * 1.5); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal.offwhite;
  ctx.beginPath(); ctx.arc(0, 0, 14, Math.PI * 1.5, Math.PI * 2); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal.green;
  ctx.fillRect(-14, -0.5, 28, 3);
  ctx.beginPath(); ctx.moveTo(4, -1.5); ctx.quadraticCurveTo(16, -5, 27, 0.5);
  ctx.lineTo(26, 3.2); ctx.quadraticCurveTo(15, -1, 4, 2.4); ctx.closePath(); ctx.fill();
  if (opts.glassesOnCap) {                                        // glasses resting on the bill
    ctx.fillStyle = pal.blue;
    ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(19, -6.5); ctx.lineTo(19.5, -2.5); ctx.lineTo(7, -0.5); ctx.closePath(); ctx.fill();
  }
  if (opts.lamp > 0) {                                            // headlamp on the cap front
    ctx.fillStyle = pal.black; ctx.fillRect(7, -12, 6, 5);
    ctx.fillStyle = `rgba(255,236,170,${0.6 + 0.4 * opts.lamp})`; ctx.beginPath(); ctx.arc(13.5, -9.5, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

function drawCarriedPoles(ctx, pal, hand, a) {
  const L = 60;
  for (let k = 0; k < 2; k++) {
    const ox = k * 2.6, oy = k * -1.8;
    const hx = hand.x + ox, hy = hand.y + oy;
    ctx.strokeStyle = pal.blue; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx + Math.cos(a) * 9, hy - Math.sin(a) * 9); ctx.lineTo(hx - Math.cos(a) * L, hy + Math.sin(a) * L); ctx.stroke();
    ctx.strokeStyle = pal.black; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hx + Math.cos(a) * 9, hy - Math.sin(a) * 9); ctx.lineTo(hx + Math.cos(a) * 1, hy - Math.sin(a) * 1); ctx.stroke();
  }
}
// Raised pole: from the hand straight up and outward (finish V).
function drawRaisedPole(ctx, pal, hand, lean, far) {
  const tip = { x: hand.x + Math.sin(lean) * 58, y: hand.y - Math.cos(lean) * 58 };
  ctx.strokeStyle = pal.blue; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hand.x, hand.y + 8); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  if (far) { ctx.strokeStyle = pal.shade; ctx.stroke(); }
  ctx.strokeStyle = pal.black; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(hand.x, hand.y + 8); ctx.lineTo(hand.x, hand.y); ctx.stroke();
}
// Planted pole: tip on the ground line, angle from straight down.
function drawPlantedPole(ctx, pal, hand, ang, far) {
  const len = Math.max(20, (-hand.y - 6) / Math.cos(ang));
  const tip = seg(hand, len, ang);
  ctx.strokeStyle = pal.blue; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hand.x, hand.y - 8); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  if (far) { ctx.strokeStyle = pal.shade; ctx.stroke(); }
  ctx.strokeStyle = pal.black; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(hand.x, hand.y - 8); ctx.lineTo(hand.x, hand.y); ctx.stroke();
}

// ===== MODULE: viewer =====
// Character viewer for likeness passes. J toggles. Jon at 4× the in-game size on a neutral ground.
const VIEWER = { STATES: ['run', 'jump', 'duck', 'uphill', 'downhill'], HOLD_S: 2, ZOOM: 4, JUMP_H: 60 };

function viewerToggle() {
  const v = GAME.viewer;
  v.on = !v.on;
  if (v.on) { v.idx = 0; v.timer = 0; v.jon = makeJon(); v.jon.state = 'run'; }
}
function viewerStep(dt) {
  const v = GAME.viewer, j = v.jon;
  v.timer += dt;
  if (v.timer >= VIEWER.HOLD_S) { v.timer = 0; v.idx = (v.idx + 1) % VIEWER.STATES.length; j.landedAt = -1; }
  const s = VIEWER.STATES[v.idx], prog = v.timer / VIEWER.HOLD_S;
  j.grounded = true; j.y = 0;
  let target;
  if (s === 'run')      { j.gait = 'flat'; j.phase += dt * 300 / JON.STRIDE_PX * Math.PI * 2; target = gaitPose(j.phase, 'flat'); }
  else if (s === 'uphill')   { j.gait = 'up';   j.phase += dt * 190 / JON.STRIDE_PX * Math.PI * 2; target = gaitPose(j.phase, 'up'); }
  else if (s === 'downhill') { j.gait = 'down'; j.phase += dt * 420 / JON.STRIDE_PX * Math.PI * 2; target = gaitPose(j.phase, 'down'); }
  else if (s === 'duck') { j.phase += dt * 1.5; target = POSES.duck; }
  else {                                                         // jump: one arc per hold
    const arc = Math.sin(prog * Math.PI);
    j.grounded = false; j.y = VIEWER.JUMP_H * arc; j.vy = VIEWER.JUMP_H * Math.PI * Math.cos(prog * Math.PI) / VIEWER.HOLD_S;
    target = prog < 0.5 ? POSES.jumpUp : POSES.jumpDown;
    if (prog > 0.96 && j.landedAt < 0) j.landedAt = performance.now();
  }
  j.prevY = j.y;
  blendPose(j, target, dt);
  const wind = s === 'uphill' ? 190 : s === 'downhill' ? 420 : 300;
  hairStep(j, jonJoints(j.pose, j.grounded), dt, wind * j.pose.windMul);
}
function viewerRender(ctx, tReal) {
  const v = GAME.viewer, j = v.jon;
  const scale = VIEWER.ZOOM * JON.TARGET_PX / JON.FIGURE_UNITS;
  const groundY = 672;
  ctx.fillStyle = '#9b9c94'; ctx.fillRect(0, 0, ENGINE.W, ENGINE.H);
  ctx.fillStyle = '#84857d'; ctx.fillRect(0, groundY, ENGINE.W, ENGINE.H - groundY);

  // Slope line so uphill/downhill read as slopes even though the ground stays flat.
  const s = VIEWER.STATES[v.idx];
  if (s === 'uphill' || s === 'downhill') {
    const g = s === 'uphill' ? -0.32 : 0.32;
    ctx.strokeStyle = 'rgba(40,40,36,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(ENGINE.W / 2 - 260, groundY - 260 * -g); ctx.lineTo(ENGINE.W / 2 + 260, groundY + 260 * -g); ctx.stroke();
    ctx.setLineDash([]);
  }

  drawJon(ctx, JON_PAL, GAME.t + tReal, j, ENGINE.W / 2, groundY - j.y, scale, j.y);

  // 1:1 in-game preview beside the big one, so the size decision is made at true scale.
  drawJon(ctx, JON_PAL, GAME.t + tReal, j, ENGINE.W - 120, groundY - j.y * 0.25, JON.TARGET_PX / JON.FIGURE_UNITS, j.y * 0.25);
  ctx.fillStyle = 'rgba(40,40,36,0.7)'; ctx.font = '14px ' + UI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`in-game size: ${JON.TARGET_PX} px`, ENGINE.W - 120, groundY + 26);

  ctx.fillStyle = '#2b2b27'; ctx.textAlign = 'left';
  ctx.font = '700 40px ' + UI_FONT; ctx.fillText(s, 40, 60);
  ctx.font = '16px ' + UI_FONT; ctx.fillStyle = 'rgba(40,40,36,0.75)';
  ctx.fillText(`Character viewer, ${VIEWER.ZOOM}× in-game size.  J: back to game    [ ]: in-game size ±10 px    ${v.idx + 1} of ${VIEWER.STATES.length}`, 40, 92);
  // Hold-timer bar
  ctx.fillStyle = 'rgba(40,40,36,0.25)'; ctx.fillRect(40, 108, 300, 4);
  ctx.fillStyle = 'rgba(40,40,36,0.7)'; ctx.fillRect(40, 108, 300 * (v.timer / VIEWER.HOLD_S), 4);
}

function courseLoopMile(course, mile) {
  const L = course.structure.loopMiles;
  return ((mile % L) + L) % L;
}
// Cosine interpolation between profile points so grade changes are smooth, not kinked.
function courseElev(course, mile) {
  const m = courseLoopMile(course, mile), e = course.elevation;
  let i = 1; while (i < e.length - 1 && e[i][0] < m) i++;
  const [m0, f0] = e[i - 1], [m1, f1] = e[i];
  const u = clamp((m - m0) / (m1 - m0 || 1), 0, 1), k = 0.5 - 0.5 * Math.cos(u * Math.PI);
  return f0 + (f1 - f0) * k;
}
function courseGrade(course, mile) {
  const d = 0.02;
  return (courseElev(course, mile + d) - courseElev(course, mile - d)) / (2 * d * 5280);
}
function courseSurface(course, mile) {
  const m = courseLoopMile(course, mile);
  for (const sgm of course.surfaces) if (m >= sgm.fromMile && m < sgm.toMile) return sgm.type;
  return course.surfaces[0].type;
}
function courseStartHour(course) {
  const [h, m] = course.startTime.split(':').map(Number);
  return h + m / 60;
}

// Trail pickups are seeded by absolute index so each lap has its own set.
function pickupAt(i) {
  if (i < 1 || hash(i * 7 + 3) > SIM.PICKUP_CHANCE) return null;
  const r = hash(i * 13 + 1);
  return { i, type: r < 0.4 ? 'gel' : r < 0.7 ? 'flask' : 'watermelon', mile: i * SIM.PICKUP_SPACING + hash(i * 17 + 5) * 0.3 };
}

const hexToRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function lerpHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return '#' + [0, 1, 2].map(i => Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2, '0')).join('');
}
function paletteAt(kit, hour) {
  const { a, b, t } = dayBlend(hour), pa = kit.palette[a], pb = kit.palette[b], out = {};
  for (const k in pa) out[k] = lerpHex(pa[k], pb[k], t);
  return out;
}

const simRng = rng(0x51a7);
function triggerStumble(j) {
  if (!j.grounded || j.stumbleT > 0) return;
  j.stumbleT = SIM.STUMBLE_S; GAME.shake = Math.max(GAME.shake, 5);
}

function simStep(dt) {
  const c = GAME.course, D = DIFFICULTY[GAME.diff], j = GAME.jon;
  const fast = GAME.fast ? 4 : 1, sdt = dt * fast;
  const prevMile = GAME.mile, prevBonk = GAME.bonk;
  GAME.mile = GAME.scroll / SIM.PX_PER_MILE;
  // Station arrivals (one per step is plenty).
  const nxt = nextStation();
  if (nxt && GAME.mile >= nxt.absMile && !GAME.aid) { GAME.nextIdx++; arriveAt(nxt); if (GAME.screen !== 'race') return; }
  GAME.lap = Math.min(c.structure.laps, Math.floor(GAME.mile / c.structure.loopMiles) + 1);
  GAME.elev = courseElev(c, GAME.mile);
  GAME.grade = courseGrade(c, GAME.mile);
  GAME.surface = courseSurface(c, GAME.mile);
  const surf = SURFACES[GAME.surface], g = GAME.grade;

  // Race clock: real seconds per game second, so day/night and cutoffs match the real event in either mode.
  GAME.raceSec += sdt * D.timeScale;
  GAME.hour = (courseStartHour(c) + GAME.raceSec / 3600) % 24;
  GAME.night = nightAmount(GAME.hour);

  // Meters: empty energy = bonk, empty hydration = cramp.
  const dMiles = Math.max(0, GAME.mile - prevMile);
  GAME.energy = clamp(GAME.energy - dMiles * METERS.ENERGY_PER_MILE * D.energyDrain * (1 + METERS.ENERGY_GRADE_K * Math.max(0, g)) * surf.drain, 0, 100);
  GAME.hydration = clamp(GAME.hydration - dMiles * METERS.HYDRATION_PER_MILE * D.hydrationDrain * (1 + METERS.HEAT_K * middayAmount(GAME.hour)) * (bonusActive('iceBandana') ? RACE.BANDANA_DRAIN_MUL : 1), 0, 100);
  GAME.bonk = GAME.energy <= 0;
  if (GAME.bonk && !prevBonk) GAME.stats.bonks++;
  if (GAME.night > 0.5) GAME.stats.nightMiles += dMiles;
  if (GAME.pacer) GAME.pacer.phase += dt * GAME.animSpeed / JON.STRIDE_PX * Math.PI * 2;
  GAME.cramp = GAME.hydration <= 0;
  if (GAME.cramp) {
    GAME.crampTimer -= sdt;
    if (GAME.crampTimer <= 0) { triggerStumble(j); GAME.crampTimer = lerp(D.crampEvery[0], D.crampEvery[1], simRng()); }
  } else GAME.crampTimer = Math.min(GAME.crampTimer, D.crampEvery[0]);
  if (j.stumbleT > 0) j.stumbleT -= dt;

  // Pickups crossed this step (swept, so Arcade speed can't skip them).
  const i0 = Math.floor(prevMile / SIM.PICKUP_SPACING), i1 = Math.floor(GAME.mile / SIM.PICKUP_SPACING) + 1;
  for (let i = i0; i <= i1; i++) {
    const p = pickupAt(i);
    if (!p || GAME.collected.has(i) || p.mile <= prevMile || p.mile > GAME.mile) continue;
    if (j.y > SIM.PICKUP_REACH_PX) continue;                    // jumped clean over it
    GAME.collected.add(i);
    const def = PICKUPS[p.type];
    GAME.energy = clamp(GAME.energy + def.energy * D.pickupMul, 0, 100);
    GAME.hydration = clamp(GAME.hydration + def.hydration * D.pickupMul, 0, 100);
    GAME.floaters.push({ x: JON.X, y: RENDER.GROUND_Y + GAME.camY - 120, text: def.label, age: 0 });
  }
  for (let k = GAME.floaters.length - 1; k >= 0; k--) { const f = GAME.floaters[k]; f.age += dt; f.y -= 30 * dt; if (f.age > 1.2) GAME.floaters.splice(k, 1); }

  // Speed: grade, surface, difficulty, bonk, stumble. animSpeed is Jon's apparent pace (drives legs and hair).
  const gradeFactor = g > 0 ? 1 / (1 + SIM.UP_K * g) : Math.min(SIM.DOWN_MAX, 1 + SIM.DOWN_K * -g);
  let target = SIM.FLAT_SPEED * gradeFactor * surf.speed * D.speedMul;
  if (g > 0 && bonusActive('poles')) target *= RACE.POLES_CLIMB_MUL;
  if (GAME.bonk) target *= D.bonkSpeed;
  if (j.stumbleT > 0) target *= SIM.STUMBLE_SPEED;
  if (GAME.aid && !GAME.aid.done) target = 0;                 // stopped at the aid table
  GAME.speed = dt > 0 ? lerpTo(GAME.speed, target, dt, GAME.aid && !GAME.aid.done ? 8 : SIM.SPEED_RATE) : target;
  GAME.animSpeed = GAME.speed / D.speedMul;
  GAME.scroll += GAME.speed * sdt;

  GAME.camY = lerpTo(GAME.camY, clamp(g * SIM.FT_TO_PX * SIM.CAM_K, -SIM.CAM_MAX, SIM.CAM_MAX), dt, SIM.CAM_RATE);
  GAME.jumpMul = clamp(1 - SIM.JUMP_GRADE_K * g, 0.75, 1.3) * surf.jump * (GAME.bonk ? D.bonkJump : 1);
  GAME.shake = Math.max(0, GAME.shake - 18 * dt);

  if (j.gait === 'flat') { if (g > SIM.GAIT_ON) j.gait = 'up'; else if (g < -SIM.GAIT_ON) j.gait = 'down'; }
  else if (j.gait === 'up' && g < SIM.GAIT_OFF) j.gait = 'flat';
  else if (j.gait === 'down' && g > -SIM.GAIT_OFF) j.gait = 'flat';
}

const RACE = {

  FINISH_ZOOM: 0.35, ZOOM_LEAD_S: 2,
  BATTERY_LAMP_MUL: 1.4, BANDANA_DRAIN_MUL: 0.6, POLES_CLIMB_MUL: 1.08,
  PACER_X_OFFSET: -125, PACER_CALLOUT_PX: 420,
  HIT_ENERGY: 10
};

// Every station visit in race order. Loop races repeat their stations per lap; the mile-0 station is the lap end.
function buildStationList(course) {
  const list = [], st = course.structure, L = st.loopMiles || 0;
  const laps = st.type === 'loop' ? st.laps : 1;
  for (let k = 0; k < laps; k++) {
    for (const s of course.aidStations) {
      const isStart = s.mile === 0;
      const absMile = isStart ? (k + 1) * L : k * L + s.mile;
      if (st.type !== 'loop' && isStart) continue;
      list.push({ station: s, absMile, lap: k, isFinish: isStart && k === laps - 1, cutoffH: cutoffFor(course, s, k, absMile) });
    }
  }
  list.sort((a, b) => a.absMile - b.absMile);
  if (st.type !== 'loop') list.push({ station: { name: 'Finish', mile: course.distanceMiles, dropBag: false, pacerStart: false }, absMile: course.distanceMiles, lap: 0, isFinish: true, cutoffH: course.timeLimitHours });
  return list;
}
// Station cutoff: per-station number, per-station per-lap array, or the course's absMile→hours schedule.
function cutoffFor(course, s, lap, absMile) {
  if (Array.isArray(s.cutoffHours)) return s.cutoffHours[lap] ?? null;
  if (typeof s.cutoffHours === 'number') return s.cutoffHours;
  const sch = course.cutoffSchedule; if (!sch) return null;
  let i = 1; while (i < sch.length - 1 && sch[i][0] < absMile) i++;
  const [m0, h0] = sch[i - 1], [m1, h1] = sch[i];
  return h0 + (h1 - h0) * clamp((absMile - m0) / (m1 - m0 || 1), 0, 1);
}
function nextStation() { return GAME.stations[GAME.nextIdx] || null; }
function raceHours() { return GAME.raceSec / 3600; }

// Called by the sim when Jon's mile crosses a station.
function arriveAt(occ) {
  const D = DIFFICULTY[GAME.diff];
  if (occ.isFinish) { startFinish(); return; }
  const late = (occ.cutoffH != null && raceHours() > occ.cutoffH) || GAME.forceCutoffMiss;
  GAME.forceCutoffMiss = false;
  if (late) { startDNF(occ, 'cutoff'); return; }
  if (GAME.bonk && GAME.cramp) { startDNF(occ, 'pulled'); return; }

  // Pacer leaves at the station after joining; joins at the first eligible station past pacerFromMile.
  if (GAME.pacer && GAME.nextIdx >= GAME.pacer.leaveIdx) { GAME.pacer = null; toast('Pacer segment done'); }
  const rules = GAME.course.rules || {};
  if (!GAME.pacer && rules.pacersAllowed && occ.station.pacerStart && occ.absMile >= (rules.pacerFromMile || 0)) {
    GAME.pacer = { shield: true, leaveIdx: GAME.nextIdx + 1, phase: 0 };
    toast('Pacer joins');
  }
  let item = null;
  if (occ.station.dropBag) {
    item = ['battery', 'iceBandana', 'poles'][GAME.nextIdx % 3];
    GAME.bonusItem = { type: item, untilIdx: GAME.nextIdx + 1 };
  }
  const dur = D.aidStopS;
  AudioBed.cowbell();
  GAME.aid = { occ, t: 0, dur, e0: GAME.energy, h0: GAME.hydration, item, done: dur === 0 };
  if (dur === 0) { GAME.energy = 100; GAME.hydration = 100; }
  GAME.jon.forcedState = dur === 0 ? null : 'aid';
}
function aidStep(dt) {
  const a = GAME.aid; if (!a) return;
  a.t += dt;
  if (!a.done) {
    const k = clamp(a.t / a.dur, 0, 1);
    GAME.energy = lerp(a.e0, 100, k); GAME.hydration = lerp(a.h0, 100, k);
    if (Input.jumpBuffered(performance.now())) {           // Space skips the stop for a partial refill
      Input.consumeJump();
      const kk = Math.max(k, RACE.SKIP_REFILL_MIN);
      GAME.energy = lerp(a.e0, 100, kk); GAME.hydration = lerp(a.h0, 100, kk);
      a.done = true;
    }
    if (a.t >= a.dur) a.done = true;
    if (a.done) { GAME.jon.forcedState = null; a.closeT = a.t; }
  } else if (a.t - (a.closeT || 0) > (a.dur === 0 ? RACE.AID_CARD_ARCADE_S : 0.6)) GAME.aid = null;
}
const ITEM_LABEL = { battery: 'Headlamp battery: wider beam to the next station', iceBandana: 'Ice bandana: slower hydration drain to the next station', poles: 'Fresh poles: faster climbing to the next station' };
function bonusActive(type) { return GAME.bonusItem && GAME.bonusItem.type === type && GAME.nextIdx < GAME.bonusItem.untilIdx; }

// Hits arrive at step 6; the pacer's shield is wired now.
function takeHit() {
  if (GAME.pacer && GAME.pacer.shield) { GAME.pacer.shield = false; toast('Pacer took that one'); GAME.shake = 4; return; }
  GAME.energy = clamp(GAME.energy - RACE.HIT_ENERGY, 0, 100); GAME.stats.hits++; GAME.shake = 7;
}

function startDNF(occ, reason) {
  GAME.screen = 'dnf';
  GAME.dnf = { occ, reason, raceSec: GAME.raceSec };
  GAME.jon.forcedState = 'sit'; GAME.aid = null; GAME.pacer = null;
}
function startFinish() {
  GAME.screen = 'finish';
  GAME.finish = { t: 0, raceSec: GAME.raceSec };
  GAME.jon.forcedState = 'finish'; GAME.aid = null; GAME.pacer = null;
}
function buckleFor(course, hours) {
  const b = course.buckles; if (!b) return 'Finisher';
  return hours <= b.gold ? 'Gold' : hours <= b.silver ? 'Silver' : hours <= b.bronze ? 'Bronze' : 'Finisher';
}
function finishSummaryText() {
  const c = GAME.course, f = GAME.finish, h = f.raceSec / 3600;
  return `Jon's Ultra — ${c.name}\nFinish: ${fmtClock(f.raceSec)} (${buckleFor(c, h)} buckle)\nHits taken: ${GAME.stats.hits}   Bonks: ${GAME.stats.bonks}   Night miles: ${GAME.stats.nightMiles.toFixed(1)}\nKatie and Emma were at the line.`;
}
function toast(text) { GAME.toasts.push({ text, age: 0 }); }

function resetRace() {
  GAME.scroll = 0; GAME.mile = 0; GAME.lap = 1; GAME.raceSec = 0; GAME.speed = 0; GAME.camY = 0;
  GAME.energy = 100; GAME.hydration = 100; GAME.bonk = false; GAME.cramp = false; GAME.crampTimer = 4;
  GAME.collected = new Set(); GAME.floaters = []; GAME.toasts = []; GAME.particles = [];
  GAME.stats = { hits: 0, bonks: 0, nightMiles: 0 };
  GAME.stations = buildStationList(GAME.course); GAME.nextIdx = 0;
  GAME.aid = null; GAME.dnf = null; GAME.finish = null; GAME.pacer = null; GAME.bonusItem = null; GAME.forceCutoffMiss = false;
  GAME.life = []; GAME.rain = 0; GAME.shooting = null;
  GAME.jon = makeJon(); GAME.jon.lastGroundedAt = performance.now();
  GAME.fast = false;

}
